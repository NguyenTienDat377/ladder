<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ladder</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f0f0f'/%3E%3Cpath d='M8 4v16M16 4v16M8 8h8M8 12h8M8 16h8' stroke='%23f5c400' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js"></script>
  <!-- Pinned: an unpinned URL can change under us and break playback. -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main class="page" id="main">
    <div class="watch">
      <div class="watch-main">
        <div class="player">
          <video id="video" controls playsinline></video>
          <button class="quality-chip" id="quality" type="button" aria-haspopup="true" aria-expanded="false"
                  aria-controls="ladder" hidden></button>
          <div class="ladder" id="ladder" role="group" aria-label="Video quality" hidden></div>
          <p class="player-notice" id="player-notice" role="status" hidden></p>
        </div>
        <h1 class="watch-title" id="title"></h1>
        <div class="watch-bar" id="bar"></div>
        <section class="description" id="description" aria-label="About this video"></section>
      </div>
      <aside class="watch-side" id="side" aria-label="Up next"></aside>
    </div>
  </main>

  <script type="module">
    const { el, icon, avatar, api, header, views, number, count, ago, longDate, loginUrl, notice,
            thumbnail, popover, VISIBILITY } = Ladder;

    const main = document.getElementById('main');
    const id = new URLSearchParams(location.search).get('id');
    const user = await header();

    let video = null;
    try {
      if (id) video = await api('GET', '/api/v1/videos/' + encodeURIComponent(id));
    } catch (error) {
      if (error.status !== 404 && error.status !== 400) {
        notice(main, 'Something went wrong', 'The video couldn’t be loaded. Try again in a moment.',
          el('button', { class: 'btn', type: 'button', onclick: () => location.reload() }, 'Try again'));
        video = undefined;
      }
    }
    if (video === null) {
      // 404 covers "doesn't exist", "private" and "still processing" alike, on purpose.
      notice(main, 'This video isn’t available', 'It may be private, still processing, or the link may be wrong.',
        el('a', { class: 'btn', href: '/' }, 'Go to the home page'));
    } else if (video) {
      render(video);
    }

    function render(video) {
      const handle = video.channel.channelHandle;
      const channelUrl = '/channel.html?handle=' + encodeURIComponent(handle);
      const owns = !!user && user.channels.some(c => c.channelId === video.channel.channelId);
      document.title = video.title + ' - ladder';
      document.getElementById('title').textContent = video.title;

      // ---- channel, subscribe, like/dislike, copy link
      const subscribers = el('span', { text: count(video.channel.subscriberCount, 'subscriber', 'subscribers') });
      const owner = el('div', { class: 'owner' },
        el('a', { class: 'owner-link', href: channelUrl },
          avatar(video.channel.channelName, handle, 'lg'),
          el('div', { class: 'owner-text' }, el('strong', { text: video.channel.channelName }), subscribers)));

      const subscribe = el('button', { class: 'btn btn-primary subscribe', type: 'button', 'aria-pressed': 'false' }, 'Subscribe');
      const paintSubscribe = on => {
        subscribe.setAttribute('aria-pressed', String(on));
        subscribe.classList.toggle('btn-primary', !on);
        subscribe.textContent = on ? 'Subscribed' : 'Subscribe';
      };
      subscribe.addEventListener('click', async () => {
        if (!user) return void (location.href = loginUrl());
        const on = subscribe.getAttribute('aria-pressed') === 'true';
        subscribe.disabled = true;
        try {
          const result = await api(on ? 'DELETE' : 'PUT', `/api/v1/channels/${encodeURIComponent(handle)}/subscription`);
          paintSubscribe(result.subscribed);
          subscribers.textContent = count(result.subscriberCount, 'subscriber', 'subscribers');
        } catch (error) {
          if (error.status === 401) location.href = loginUrl();
        } finally {
          subscribe.disabled = false;
        }
      });
      owner.append(owns ? el('a', { class: 'btn', href: channelUrl }, 'Manage videos') : subscribe);

      let mine = video.myReaction;
      const likes = el('span');
      const dislikes = el('span');
      const like = el('button', { class: 'btn', type: 'button', 'aria-label': 'Like' }, icon('like'), likes);
      const dislike = el('button', { class: 'btn', type: 'button', 'aria-label': 'Dislike' }, icon('dislike'), dislikes);
      const paintReactions = state => {
        mine = state.myReaction;
        like.setAttribute('aria-pressed', String(mine === 'LIKE'));
        dislike.setAttribute('aria-pressed', String(mine === 'DISLIKE'));
        likes.textContent = number(state.likeCount);
        dislikes.textContent = number(state.dislikeCount);
      };
      paintReactions(video);
      const react = async kind => {
        if (!user) return void (location.href = loginUrl());
        const undo = mine === kind; // pressing the active one takes it back
        like.disabled = dislike.disabled = true;
        try {
          paintReactions(await api(undo ? 'DELETE' : 'PUT', `/api/v1/videos/${video.videoId}/reaction`,
            undo ? {} : { json: { reaction: kind } }));
        } catch (error) {
          if (error.status === 401) location.href = loginUrl();
        } finally {
          like.disabled = dislike.disabled = false;
        }
      };
      like.addEventListener('click', () => react('LIKE'));
      dislike.addEventListener('click', () => react('DISLIKE'));

      const copyLabel = el('span', { text: 'Copy link' });
      const copy = el('button', { class: 'btn', type: 'button' }, icon('link'), copyLabel);
      copy.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(location.origin + '/watch.html?id=' + video.videoId);
          copyLabel.textContent = 'Copied';
        } catch {
          copyLabel.textContent = 'Couldn’t copy';
        }
        setTimeout(() => { copyLabel.textContent = 'Copy link'; }, 2000);
      });

      document.getElementById('bar').append(owner,
        el('div', { class: 'actions' }, el('div', { class: 'reactions' }, like, dislike), copy));

      // ---- description box
      const viewCount = el('span', { text: views(video.viewCount) });
      const visibility = video.visibility !== 'PUBLIC'
        ? el('span', { class: 'badge' }, icon(video.visibility === 'PRIVATE' ? 'lock' : 'unlisted', 14),
            VISIBILITY[video.visibility].label)
        : null;
      const text = el('p', { class: 'description-text clamped', text: video.description || '' });
      const description = document.getElementById('description');
      description.append(
        el('div', { class: 'description-meta' }, viewCount, el('span', { text: longDate(video.createdAt) }), visibility),
        text);
      requestAnimationFrame(() => {
        if (text.scrollHeight > text.clientHeight + 2) {
          const toggle = el('button', { class: 'link-btn', type: 'button', 'aria-expanded': 'false' }, 'Show more');
          toggle.addEventListener('click', () => {
            const open = text.classList.toggle('clamped') === false;
            toggle.textContent = open ? 'Show less' : 'Show more';
            toggle.setAttribute('aria-expanded', String(open));
          });
          description.append(toggle);
        }
      });

      // ---- up next: this channel's other videos first, then the rest of the feed
      Promise.all([
        api('GET', `/api/v1/channels/${encodeURIComponent(handle)}?limit=13`).catch(() => null),
        api('GET', '/api/v1/videos?limit=13').catch(() => null),
      ]).then(([channel, feed]) => {
        if (channel) paintSubscribe(channel.subscribed);
        const seen = new Set([video.videoId]);
        const next = [...(channel ? channel.videos.items : []), ...(feed ? feed.items : [])]
          .filter(item => item.status === 'READY' && !seen.has(item.videoId) && seen.add(item.videoId))
          .slice(0, 12);
        const side = document.getElementById('side');
        if (!next.length) return;
        side.append(el('h2', { class: 'side-title', text: 'Up next' }));
        for (const item of next) {
          side.append(el('a', { class: 'compact', href: '/watch.html?id=' + item.videoId }, thumbnail(item),
            el('div', { class: 'card-text' },
              el('h3', { class: 'card-title', text: item.title }),
              el('span', { class: 'card-sub', text: item.channelName }),
              el('span', { class: 'card-sub', text: views(item.viewCount) + ' · ' + ago(item.createdAt) }))));
        }
      });

      startPlayer(video, viewCount);
    }

    // ---------------------------------------------------------------- player

    function startPlayer(video, viewCount) {
      const element = document.getElementById('video');
      const chip = document.getElementById('quality');
      const ladder = document.getElementById('ladder');
      const playerNotice = document.getElementById('player-notice');
      const src = `/api/v1/videos/${video.videoId}/master.m3u8`;
      if (video.thumbnailUrl) element.poster = video.thumbnailUrl;

      const fail = message => {
        playerNotice.textContent = message;
        playerNotice.hidden = false;
        chip.hidden = true;
        ladder.hidden = true;
      };

      // One view per playback start; the server dedupes per viewer for 30 minutes anyway.
      let counted = false;
      element.addEventListener('playing', async () => {
        if (counted) return;
        counted = true;
        try {
          viewCount.textContent = views((await api('POST', `/api/v1/videos/${video.videoId}/view`)).viewCount);
        } catch {
          // A view that didn't count is not worth bothering the viewer about.
        }
      });

      if (window.Hls && Hls.isSupported()) {
        hlsPlayer(element, src, chip, ladder, fail);
      } else if (element.canPlayType('application/vnd.apple.mpegurl')) {
        element.src = src; // iOS Safari: native HLS picks the quality itself, no ladder to show
      } else {
        fail('This browser can’t play HLS video.');
      }
    }

    // The master playlist has no RESOLUTION attribute, so the rung's name comes
    // from its playlist URL: ".../480p/playlist.m3u8".
    function labelOf(level, index) {
      const uri = level.uri || [].concat(level.url)[0] || '';
      const match = uri.match(/\/(\d+p)\/playlist\.m3u8/);
      return match ? match[1] : level.height ? level.height + 'p' : 'Rung ' + (index + 1);
    }

    const mbps = bits => (bits / 1e6).toFixed(1) + ' Mb/s';

    function hlsPlayer(element, src, chip, ladder, fail) {
      const hls = new Hls();
      let labels = [];
      let rates = [];
      let playing = -1;
      let held = -1;
      let estimate = null;
      let recovered = false;

      popover(chip, ladder);

      const paint = () => {
        const current = playing >= 0 ? labels[playing] : '';
        chip.replaceChildren(icon('ladder', 16), `${current} · ${held >= 0 ? 'Held' : 'Auto'}`);
        chip.setAttribute('aria-label', `Video quality: ${current || 'loading'}, ${held >= 0 ? 'held' : 'automatic'}`);

        // Highest rung first. The dashed "your connection" line sits between the
        // rungs it can't carry and the ones it can: the player climbs to the
        // highest rung below it.
        const rows = [el('div', { class: 'ladder-title', text: 'Quality' })];
        let marked = estimate === null;
        for (let i = rates.length - 1; i >= 0; i--) {
          if (!marked && rates[i] <= estimate) {
            rows.push(el('div', { class: 'reach', text: 'Your connection ' + mbps(estimate) }));
            marked = true;
          }
          const rung = el('button', {
            class: 'rung' + (i === playing ? ' playing' : ''), type: 'button', 'aria-pressed': String(i === held),
            // Wider type for more bits: the width axis carries the bitrate.
            onclick: () => { hls.nextLevel = i; held = i; paint(); },
          }, el('span', { class: 'res', style: `font-stretch:${75 + (50 * i) / Math.max(1, rates.length - 1)}%`, text: labels[i] }),
             el('span', { class: 'rate', text: mbps(rates[i]) }));
          rows.push(rung);
        }
        if (!marked) rows.push(el('div', { class: 'reach', text: 'Your connection ' + mbps(estimate) }));
        rows.push(el('button', {
          class: 'ladder-auto', type: 'button', 'aria-pressed': String(held === -1),
          onclick: () => { hls.nextLevel = -1; held = -1; paint(); },
        }, el('span', { text: 'Auto' }), el('span', { text: 'Plays the highest rung under your connection' })));
        ladder.replaceChildren(...rows);
      };

      hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
        labels = data.levels.map(labelOf);
        rates = data.levels.map(level => level.bitrate);
        chip.hidden = false;
        paint();
      });
      hls.on(Hls.Events.LEVEL_SWITCHED, (_, data) => {
        playing = data.level;
        paint();
      });
      hls.on(Hls.Events.FRAG_LOADED, () => {
        if (hls.bandwidthEstimate > 0) {
          estimate = hls.bandwidthEstimate;
          // Not while the popover is open: rebuilding it every segment would
          // pull keyboard focus out of it. It's current again next time it opens.
          if (ladder.hidden) paint();
        }
      });
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (!data.fatal) return; // hls.js retries those itself
        const code = data.response && data.response.code;
        if (data.type === Hls.ErrorTypes.MEDIA_ERROR && !recovered) {
          recovered = true;
          hls.recoverMediaError();
          return;
        }
        if (data.details === Hls.ErrorDetails.FRAG_LOAD_ERROR && code === 0) {
          // Status 0 = the browser hid a blocked cross-origin response.
          fail(`Video segments were blocked by the browser. Check that storage allows the origin ${location.origin} (ladder.storage.cors-origin).`);
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          fail('This video couldn’t be decoded.');
        } else {
          fail('Lost the connection to the video server. Reload the page to try again.');
        }
        hls.destroy();
      });

      hls.loadSource(src);
      hls.attachMedia(element);
    }
  </script>
</body>
</html>
