spring.application.name=ladder
ladder.storage.endpoint=http://localhost:9000
ladder.storage.cors-origin=http://localhost:8080
ladder.storage.access-key=ladder
ladder.storage.secret-key=ladder-secret
ladder.storage.bucket=videos

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Transcode worker. One job at a time per worker: ffmpeg saturates every core,
# so taking a second job just makes both slower. Scale by adding workers.
spring.rabbitmq.listener.simple.prefetch=1
# Bounded retries, then dead-letter: a corrupt upload fails every time, and
# without a ceiling it would retry forever and block real work.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=5s
spring.rabbitmq.listener.simple.default-requeue-rejected=false
